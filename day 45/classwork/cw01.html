<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="cw01.css">
</head>
<body>

    <!-- შექმენი 600px × 500px ზომის parent ელემენტი და მასში მოათავსე 6 child ელემენტი. ელემენტები განალაგე ვერტიკალურად და თუ ყველა ელემენტი ერთ ხაზზე ვერ დაეტევა, გადაიტანე ისინი შემდეგ ხაზზე. -->

    <div class="parent">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
    </div>

</body>
</html>
