<!-- შექმენი ცალკე style.css ფაილი და დააკავშირე HTML ფაილთან. შემდეგ:
- <body> ელემენტს მიეცი ნაცრისფერი ფონი
- <h1> ელემენტს თეთრი ტექსტი
- <p> ელემენტს 25px ზომა -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: gray;
        }
        h1 {
            color: white;
        }
        p {
            font-size: 25px;
        }
    </style>
</head>
<body>
    <h1>This is a heading</h1>
    <p>This is a paragraph.</p>
</body>
</html>
