<!--  შექმენი HTML და CSS ფაილები. გამოიყენე external CSS და:
- <h1> იყოს ცენტრში და ლურჯი
- <p> იყოს მარჯვნივ და წითელი
- body-ს ჰქონდეს ღია ყვითელი ფონი -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: lightyellow;
        }
        h1 {
            color: blue;
            text-align: center;
        }
        p {
            color: red;
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>This is a heading</h1>
    <p>This is a paragraph.</p>
</body>
</html>
