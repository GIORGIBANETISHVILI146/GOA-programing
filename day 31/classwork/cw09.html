<!--  ექმენი HTML ფაილი, სადაც იქნება 4 სხვადასხვა ტექსტი. გამოიყენე internal CSS და:
- თითოეულ ტექსტს განსხვავებული text-align
- განსხვავებული ფერი
- განსხვავებული ზომა -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text1 {
            text-align: left;
            color: red;
            font-size: 20px;
        }
        .text2 {
            text-align: center;
            color: blue;
            font-size: 25px;
        }
        .text3 {
            text-align: right;
            color: green;
            font-size: 30px;
        }
        .text4 {
            text-align: justify;
            color: orange;
            font-size: 35px;
        }
    </style>
</head>
<body>
    <p >This is the first text.</p>
    <p >This is the second text.</p>
    <p >This is the third text.</p>
    <p >This is the fourth text.</p>
</body>
</html>
