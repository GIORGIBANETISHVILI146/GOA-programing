<!--3. შექმენი HTML ფაილი და დაამატე:
- <h1>
- <p>
- <button>

გამოიყენე internal CSS და თითოეულ ელემენტს განსხვავებული:
- ტექსტის ფერი
- ფონური ფერი
- ტექსტის ზომა
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: blue;
            background-color: lightgray;
            font-size: 36px;
        }
        p {
            color: green;
            background-color: yellow;
            font-size: 18px;
        }
        button {
            color: white;
            background-color: red;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>This is a heading</h1>
    <p>This is a paragraph.</p>
    <button>Click Me</button>
</body>
</html>
